<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Split of an average stake: 87.67 percent prizes, 2 percent jackpots, 0.33 percent prize bank, 10 percent project">
<title>Split of an average stake: 87.67 percent prizes, 2 percent jackpots, 0.33 percent prize bank, 10 percent project</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="860" height="250" rx="14" fill="#fbfaf6" stroke="#c9cfd8"/>
<text x="30" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1c2430" text-anchor="start">Where an average stake goes</text><text x="30" y="64" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">Computed from the program's prize tables. The same split applies to every game.</text><rect x="40" y="96" width="683.826" height="54" fill="#d9f2ee" stroke="#0f766e" stroke-width="1.5"/><text x="381.913" y="129" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">87.67%</text><rect x="723.826" y="96" width="15.6" height="54" fill="#fbefd2" stroke="#b7791f" stroke-width="1.5"/><rect x="739.426" y="96" width="6" height="54" fill="#dfe8fd" stroke="#1d4ed8" stroke-width="1.5"/><rect x="745.426" y="96" width="78" height="54" fill="#fde4e1" stroke="#b42318" stroke-width="1.5"/><text x="784.426" y="129" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#b42318" text-anchor="middle">10%</text><rect x="40" y="178" width="14" height="14" rx="3" fill="#d9f2ee" stroke="#0f766e"/><text x="62" y="190" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1c2430" text-anchor="start">87.67% prizes (incl. free re-spins)</text><rect x="331.6" y="178" width="14" height="14" rx="3" fill="#fbefd2" stroke="#b7791f"/><text x="353.6" y="190" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1c2430" text-anchor="start">2% jackpots</text><rect x="479.20000000000005" y="178" width="14" height="14" rx="3" fill="#dfe8fd" stroke="#1d4ed8"/><text x="501.20000000000005" y="190" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1c2430" text-anchor="start">0.33% prize bank</text><rect x="641.2" y="178" width="14" height="14" rx="3" fill="#fde4e1" stroke="#b42318"/><text x="663.2" y="190" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1c2430" text-anchor="start">10% project</text><text x="40" y="226" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">About 90% returns to players on average — a larger house share than many competing sites advertise.</text>
</svg>
