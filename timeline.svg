<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Timeline of a round: commit, bet, block closes, reveal, settle">
<title>Timeline of a round: commit, bet, block closes, reveal, settle</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="860" height="300" rx="14" fill="#fbfaf6" stroke="#c9cfd8"/>
<text x="30" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1c2430" text-anchor="start">Life of one round</text><text x="30" y="64" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">Steps 4 and 5 are one transaction, normally a few seconds after the bet.</text><line x1="80" y1="150" x2="780" y2="150" stroke="#c9cfd8" stroke-width="3"/><circle cx="80" cy="150" r="17" fill="#0f766e"/><text x="80" y="155" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="80" y="116" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1c2430" text-anchor="middle">Commit</text><text x="80" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">operator writes the</text><text x="80" y="212" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">Merkle root on-chain</text><circle cx="255" cy="150" r="17" fill="#1c2430"/><text x="255" y="155" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="255" y="116" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1c2430" text-anchor="middle">Bet</text><text x="255" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">your transaction gets</text><text x="255" y="212" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">the next secret number</text><circle cx="430" cy="150" r="17" fill="#b7791f"/><text x="430" y="155" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="430" y="116" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1c2430" text-anchor="middle">Block closes</text><text x="430" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">its hash becomes</text><text x="430" y="212" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">the second half</text><circle cx="605" cy="150" r="17" fill="#1c2430"/><text x="605" y="155" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="605" y="116" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1c2430" text-anchor="middle">Reveal</text><text x="605" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">operator publishes the</text><text x="605" y="212" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">secret and its proof</text><circle cx="780" cy="150" r="17" fill="#1c2430"/><text x="780" y="155" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="780" y="116" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1c2430" text-anchor="middle">Settle</text><text x="780" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">program checks the proof</text><text x="780" y="212" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">and pays in the same step</text><path d="M80 234 v14 H605 v-14" fill="none" stroke="#0f766e" stroke-dasharray="5 4" stroke-width="1.5"/><text x="342.5" y="268" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f766e" text-anchor="middle">the secret revealed at step 4 must lead to the root written at step 1</text>
</svg>
