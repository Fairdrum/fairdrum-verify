<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-label="Timeouts: normal settlement in seconds, no jackpots after about 20 minutes, full refund if the secret is never revealed">
<title>Timeouts: normal settlement in seconds, no jackpots after about 20 minutes, full refund if the secret is never revealed</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="860" height="310" rx="14" fill="#fbfaf6" stroke="#c9cfd8"/>
<text x="30" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1c2430" text-anchor="start">What happens if the operator does not settle</text><text x="30" y="64" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">Time since the bet. Limits are counted in network slots; minutes are approximate.</text><rect x="40" y="124" width="152" height="52" rx="8" fill="#d9f2ee" stroke="#0f766e" stroke-width="1.5"/><text x="118" y="147" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">seconds</text><text x="118" y="165" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1c2430" text-anchor="middle">normal settlement</text><rect x="196" y="124" width="198.8" height="52" rx="8" fill="#fbefd2" stroke="#b7791f" stroke-width="1.5"/><text x="297.4" y="147" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b7791f" text-anchor="middle">up to ~20 min</text><text x="297.4" y="165" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1c2430" text-anchor="middle">settles, with jackpots</text><rect x="398.8" y="124" width="214.39999999999998" height="52" rx="8" fill="#dfe8fd" stroke="#1d4ed8" stroke-width="1.5"/><text x="508" y="147" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">after ~20 min</text><text x="508" y="165" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1c2430" text-anchor="middle">settles, WITHOUT jackpots</text><rect x="617.2" y="124" width="198.8" height="52" rx="8" fill="#fde4e1" stroke="#b42318" stroke-width="1.5"/><text x="718.6" y="147" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b42318" text-anchor="middle">~24 hours, sealed</text><text x="718.6" y="165" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#1c2430" text-anchor="middle">stake refunded in full</text><rect x="40" y="214" width="520" height="62" rx="10" fill="#fff" stroke="#c9cfd8" stroke-width="1.5"/><text x="56" y="238" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1c2430" text-anchor="start">Round never sealed and not settled within a few minutes:</text><text x="56" y="260" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1c2430" text-anchor="start">anyone may close it — the stake is refunded in full.</text><rect x="580" y="214" width="240" height="62" rx="10" fill="#fff" stroke="#c9cfd8" stroke-width="1.5"/><text x="596" y="238" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1c2430" text-anchor="start">Every refund adds one to a</text><text x="596" y="260" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1c2430" text-anchor="start">public counter in the program.</text>
</svg>
