<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="What the round check proves and what it does not cover">
<title>What the round check proves and what it does not cover</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="860" height="330" rx="14" fill="#fbfaf6" stroke="#c9cfd8"/>
<text x="30" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1c2430" text-anchor="start">What the check proves — and what it does not</text><rect x="30" y="62" width="390" height="240" rx="10" fill="#d9f2ee" stroke="#0f766e" stroke-width="1.5"/><text x="50" y="92" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">YOU CAN VERIFY</text><text x="50" y="122" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">✓ the secret was fixed before your bet</text><text x="50" y="146" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">✓ the secret is the one committed for your</text><text x="50" y="170" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">round number, not a neighbour's</text><text x="50" y="194" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">✓ the round value follows from the secret</text><text x="50" y="218" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">and the block hash</text><text x="50" y="242" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">✓ a refund happened when a round was</text><text x="50" y="266" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">not settled (public counter)</text><rect x="440" y="62" width="390" height="240" rx="10" fill="#fde4e1" stroke="#b42318" stroke-width="1.5"/><text x="460" y="92" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b42318" text-anchor="start">THE CHECK DOES NOT COVER</text><text x="460" y="122" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">✗ the house share (about 7%; 10% in version 1)</text><text x="460" y="146" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">✗ whether a game is a good idea for you</text><text x="460" y="170" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">✗ future versions of the program</text><text x="460" y="194" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">(upgrades are visible in an explorer)</text><text x="460" y="218" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">✗ whether the published source has</text><text x="460" y="242" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#1c2430" text-anchor="start">mistakes: no external audit</text>
</svg>
