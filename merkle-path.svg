<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="A Merkle tree: the revealed secret and three sibling hashes are enough to recompute the root">
<title>A Merkle tree: the revealed secret and three sibling hashes are enough to recompute the root</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="860" height="420" rx="14" fill="#fbfaf6" stroke="#c9cfd8"/>
<text x="30" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1c2430" text-anchor="start">One short hash commits to a million secrets</text><text x="30" y="64" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">To prove one leaf belongs to the root you need only its siblings on the way up — the gold boxes.</text><line x1="430" y1="128" x2="230" y2="172" stroke="#0f766e" stroke-width="3"/><line x1="430" y1="128" x2="630" y2="172" stroke="#c9cfd8" stroke-width="1.5"/><line x1="230" y1="208" x2="130" y2="252" stroke="#0f766e" stroke-width="3"/><line x1="230" y1="208" x2="330" y2="252" stroke="#c9cfd8" stroke-width="1.5"/><line x1="630" y1="208" x2="530" y2="252" stroke="#c9cfd8" stroke-width="1.5"/><line x1="630" y1="208" x2="730" y2="252" stroke="#c9cfd8" stroke-width="1.5"/><line x1="130" y1="288" x2="80" y2="332" stroke="#c9cfd8" stroke-width="1.5"/><line x1="130" y1="288" x2="180" y2="332" stroke="#0f766e" stroke-width="3"/><line x1="330" y1="288" x2="280" y2="332" stroke="#c9cfd8" stroke-width="1.5"/><line x1="330" y1="288" x2="380" y2="332" stroke="#c9cfd8" stroke-width="1.5"/><line x1="530" y1="288" x2="480" y2="332" stroke="#c9cfd8" stroke-width="1.5"/><line x1="530" y1="288" x2="580" y2="332" stroke="#c9cfd8" stroke-width="1.5"/><line x1="730" y1="288" x2="680" y2="332" stroke="#c9cfd8" stroke-width="1.5"/><line x1="730" y1="288" x2="780" y2="332" stroke="#c9cfd8" stroke-width="1.5"/><rect x="370" y="92" width="120" height="36" rx="8" fill="#d9f2ee" stroke="#0f766e" stroke-width="1.5"/><text x="430" y="115" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">ROOT</text><rect x="182" y="172" width="96" height="36" rx="8" fill="#d9f2ee" stroke="#0f766e" stroke-width="1.5"/><text x="230" y="195" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">hash</text><rect x="582" y="172" width="96" height="36" rx="8" fill="#fbefd2" stroke="#b7791f" stroke-width="1.5"/><text x="630" y="195" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b7791f" text-anchor="middle">hash</text><rect x="82" y="252" width="96" height="36" rx="8" fill="#d9f2ee" stroke="#0f766e" stroke-width="1.5"/><text x="130" y="275" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">hash</text><rect x="282" y="252" width="96" height="36" rx="8" fill="#fbefd2" stroke="#b7791f" stroke-width="1.5"/><text x="330" y="275" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b7791f" text-anchor="middle">hash</text><rect x="482" y="252" width="96" height="36" rx="8" fill="#eef0f3" stroke="#c9cfd8" stroke-width="1.5"/><text x="530" y="275" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">hash</text><rect x="682" y="252" width="96" height="36" rx="8" fill="#eef0f3" stroke="#c9cfd8" stroke-width="1.5"/><text x="730" y="275" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">hash</text><rect x="42" y="332" width="76" height="36" rx="8" fill="#fbefd2" stroke="#b7791f" stroke-width="1.5"/><text x="80" y="355" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b7791f" text-anchor="middle">secret 0</text><rect x="142" y="332" width="76" height="36" rx="8" fill="#d9f2ee" stroke="#0f766e" stroke-width="1.5"/><text x="180" y="355" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">secret 1</text><rect x="242" y="332" width="76" height="36" rx="8" fill="#eef0f3" stroke="#c9cfd8" stroke-width="1.5"/><text x="280" y="355" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">secret 2</text><rect x="342" y="332" width="76" height="36" rx="8" fill="#eef0f3" stroke="#c9cfd8" stroke-width="1.5"/><text x="380" y="355" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">secret 3</text><rect x="442" y="332" width="76" height="36" rx="8" fill="#eef0f3" stroke="#c9cfd8" stroke-width="1.5"/><text x="480" y="355" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">secret 4</text><rect x="542" y="332" width="76" height="36" rx="8" fill="#eef0f3" stroke="#c9cfd8" stroke-width="1.5"/><text x="580" y="355" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">secret 5</text><rect x="642" y="332" width="76" height="36" rx="8" fill="#eef0f3" stroke="#c9cfd8" stroke-width="1.5"/><text x="680" y="355" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">secret 6</text><rect x="742" y="332" width="76" height="36" rx="8" fill="#eef0f3" stroke="#c9cfd8" stroke-width="1.5"/><text x="780" y="355" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">secret 7</text><text x="430" y="86" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0f766e" text-anchor="middle">stored in the program before any bet</text><text x="30" y="398" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">Green: your secret and the hashes computed from it.   Gold: the proof — three hashes here, twenty in a tree of 1,048,576 secrets.</text>
</svg>
