<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="The round value is made of two halves: the operator's committed secret and the hash of the bet's block">
<title>The round value is made of two halves: the operator's committed secret and the hash of the bet's block</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6675"/></marker></defs>
<rect width="860" height="330" rx="14" fill="#fbfaf6" stroke="#c9cfd8"/>
<text x="30" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1c2430" text-anchor="start">Two halves of one number</text><text x="30" y="64" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">Neither side holds both halves early enough to steer the result.</text><rect x="30" y="90" width="370" height="130" rx="10" fill="#d9f2ee" stroke="#0f766e" stroke-width="1.5"/><text x="50" y="120" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">HALF 1 — the round secret</text><text x="50" y="148" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1c2430" text-anchor="start">Known to: the operator only</text><text x="50" y="172" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1c2430" text-anchor="start">Fixed: before the bet — its Merkle root</text><text x="50" y="192" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1c2430" text-anchor="start">is already stored in the program</text><rect x="460" y="90" width="370" height="130" rx="10" fill="#fbefd2" stroke="#b7791f" stroke-width="1.5"/><text x="480" y="120" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#b7791f" text-anchor="start">HALF 2 — hash of the bet's block</text><text x="480" y="148" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1c2430" text-anchor="start">Known to: nobody — the block</text><text x="480" y="168" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1c2430" text-anchor="start">does not exist yet</text><text x="480" y="192" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1c2430" text-anchor="start">Fixed: when the network closes the block</text><line x1="215" y1="220" x2="380" y2="262" stroke="#5b6675" stroke-width="1.5"  marker-end="url(#a)"/><line x1="645" y1="220" x2="480" y2="262" stroke="#5b6675" stroke-width="1.5"  marker-end="url(#a)"/><rect x="250" y="250" width="360" height="54" rx="10" fill="#fff" stroke="#1c2430" stroke-width="1.5"/><text x="430" y="274" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="middle">round value =</text><text x="430" y="293" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#1c2430" text-anchor="middle">SHA-256(label, secret, block hash)</text>
</svg>
